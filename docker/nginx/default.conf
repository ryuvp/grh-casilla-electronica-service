server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    # CORS headers: nginx es la UNICA fuente de estos headers (el CORS de
    # Laravel esta deshabilitado para esta app, ver config/cors.php) para
    # evitar que ambos agreguen "Access-Control-Allow-Origin" y el navegador
    # reciba un valor duplicado ("*, *"), que rechaza por completo (bloquea
    # toda peticion real, no solo el preflight).
    #
    # `add_header` con `if` solo es valido dentro de un contexto `location`,
    # no directamente en `server`; por eso estos headers van a nivel server
    # (aplican a toda respuesta, incluida la del preflight) y el atajo de
    # preflight abajo solo hace `return 204` sin repetir `add_header`.
    #
    # Access-Control-Allow-Headers se refleja dinamicamente desde lo que el
    # navegador pide en el preflight (Access-Control-Request-Headers), en vez
    # de una lista fija: asi headers personalizados como X-Designacion-Id
    # (usado por RemoteAuth) no quedan bloqueados si se agrega uno nuevo mas
    # adelante y se olvida actualizar esta lista.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;

    # Handle preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Compression settings
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Browser cache control
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|ttf|woff|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = / {
        return 302 http://localhost:5178;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Optimized PHP handling
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass casilla_electronica_service_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(git|env|env.example|json|log|md|lock|yaml|yml)$ {
        deny all;
    }

    # Increased max body size
    client_max_body_size 20M;
    
    # Disable server tokens
    server_tokens off;
    
    # Add security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
